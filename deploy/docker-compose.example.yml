---
name: alreadyon

services:
  alreadyon:
    # Published production channel; use nightly or latest for dev/test.
    image: ghcr.io/alreadyonapp/alreadyon:stable
    container_name: alreadyon
    restart: unless-stopped
    # Required for home-LAN mDNS discovery on Linux Docker Engine.
    # Host mode binds HTTPS 19900 and optional HTTP-01 19902 directly.
    network_mode: host
    devices:
      - /dev/dri:/dev/dri
    # Optional for hardware transcoding when running as a non-root `user:`.
    # Find host device GIDs with: stat -c '%g %n' /dev/dri/*
    # Replace these IDs as needed; omit this block and `devices` for CPU-only use.
    group_add:
      - '44' # /dev/dri/card1
      - '991' # /dev/dri/renderD128
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/New_York
    volumes:
      - ./:/config
      - /data/media:/data/media:ro
    tmpfs:
      - /config/transcode:size=8g,uid=1000,gid=1000,mode=0700 # Change the size if you want to consume more or less RAM for temporary transcoding storage
