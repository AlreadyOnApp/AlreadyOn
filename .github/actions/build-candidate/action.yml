# Build and smoke-test the exact runtime candidate on its own hosted runner.
name: Build runtime candidate
description: Build the application layers and run runtime integration tests
inputs:
  revision:
    description: Exact source commit stamped into the image metadata
    required: true
  ci-base:
    description: Immutable CI/build base image reference
    required: true
  runtime-base:
    description: Immutable runtime base image reference
    required: true
runs:
  using: composite
  steps:
    - uses: docker/setup-buildx-action@v4
      with:
        name: alreadyon-pr-${{ github.run_id }}
        driver-opts: |
          memory=5g
          cpu-period=100000
          cpu-quota=200000
        buildkitd-config-inline: |
          [worker.oci]
            max-parallelism = 2
    - name: Build runtime candidate
      uses: docker/build-push-action@v7
      with:
        context: .
        file: deploy/Dockerfile
        target: runtime
        platforms: linux/amd64
        load: true
        # Reuse dependency/compile layers, never validation results. The unique
        # build stamp below still creates a fresh candidate for every attempt.
        cache-from: type=gha,scope=alreadyon-application-amd64
        cache-to: type=gha,scope=alreadyon-application-amd64,mode=max
        tags: alreadyon-ci:candidate
        build-args: |
          CI_BASE=${{ inputs.ci-base }}
          RUNTIME_BASE=${{ inputs.runtime-base }}
          VCS_REF=${{ inputs.revision }}
          BUILD_TIMESTAMP=${{ github.run_id }}-${{ github.run_attempt }}
    - name: Smoke-test the exact runtime candidate
      shell: bash
      run: python3 tests/integration/container.py
      env:
        CONTAINER_IMAGE: alreadyon-ci:candidate
