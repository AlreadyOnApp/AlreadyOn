# Scan the candidate before publication; raw findings stay on the ephemeral runner.
name: Scan source and exact image
description: Report dependency and image findings without publishing raw security reports
inputs:
  image:
    description: Local candidate image name
    required: true
runs:
  using: composite
  steps:
    - uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: '17'
    - uses: android-actions/setup-android@v3
    - name: Scan before publication
      shell: bash
      run: |
        set -euo pipefail
        python3 scripts/security/install-trivy.py "$RUNNER_TEMP/security-tools"
        docker save "$SCAN_IMAGE" -o "$RUNNER_TEMP/security-candidate.tar"
        python3 scripts/security/scan.py --trivy "$RUNNER_TEMP/security-tools/trivy" \
          --image-archive "$RUNNER_TEMP/security-candidate.tar" --output "$RUNNER_TEMP/security-report"
        printf '\n### Vulnerability scan (report-only)\n\n```json\n' >> "$GITHUB_STEP_SUMMARY"
        cat "$RUNNER_TEMP/security-report/summary.json" >> "$GITHUB_STEP_SUMMARY"
        printf '\n```\nRaw reports are not uploaded from public workflows.\n' >> "$GITHUB_STEP_SUMMARY"
      env:
        SCAN_IMAGE: ${{ inputs.image }}
