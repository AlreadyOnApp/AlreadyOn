# Scheduled refreshes capture Ubuntu, codec and browser security updates even
# when the repository's base-image recipe has not changed.
name: Weekly Build Base Images
on:
  # Local builds refresh expired bases on demand while Actions credits are exhausted.
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: base-images
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    steps:
      # Scheduled workflows are defined by main but build the active dev recipe.
      - uses: actions/checkout@v7
        with:
          ref: dev
          persist-credentials: false
      - name: Make room for the two base images
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          sudo -n rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Select recipe revision
        id: base
        run: echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/build-bases
        with:
          image: ghcr.io/${{ github.repository }}-base
          revision: ${{ steps.base.outputs.revision }}
          refresh: 'true'
