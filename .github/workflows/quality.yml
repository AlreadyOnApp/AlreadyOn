# Lightweight static checks; pull-request.yml calls this as part of the PR gate.
name: Check Code Quality
on:
  workflow_call:
    inputs:
      revision:
        description: Optional exact release source; PR callers use the default merge ref
        type: string
        default: ''
permissions:
  contents: read
env:
  TZ: America/New_York
jobs:
  quality:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.revision }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Read shared Node version
        id: node
        run: echo "version=$(sed -n 's/^ARG NODE_VERSION=//p' deploy/Dockerfile)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ steps.node.outputs.version }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --prefix web
      - name: Formatting, static analysis and type checking
        run: |
          make lint
          cd web && npx tsc -b --pretty false
      - name: Documentation and source comments
        env:
          CI_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python3 scripts/ci/check-documentation.py
      - name: Validate script, JSON and workflow syntax
        run: |
          python3 scripts/ci/check-syntax.py
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          actionlint
      - name: Test CI policy helpers
        run: python3 -m unittest discover -s scripts/ci -p 'test_*.py'
